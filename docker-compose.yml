services:
  ollama:
    image: ollama/ollama
    volumes: [ollama:/root/.ollama]
  zevon:
    build: .
    ports: ["8000:8000"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      ZEVON_MODEL: qwen3:8b
      ZEVON_DB: /data/zevon.db
      ZEVON_API_TOKEN: ${ZEVON_API_TOKEN:-change-me}
    volumes: [zevon-data:/data]
    depends_on: [ollama]
volumes: {ollama: {}, zevon-data: {}}
